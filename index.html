<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17111e">
    <meta name="description" content="Small Pokémon GO tools from PigeonLabz.">
    <title>PigeonLabz | Pokémon GO tools</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-line">
          <span class="brand-mark" aria-hidden="true">P</span>
          <p class="eyebrow">Pokémon GO tools</p>
        </div>
        <h1>PigeonLabz</h1>
      </header>

      <section class="tool-grid" aria-label="Tools">
        <article class="tool-card">
          <a class="tool-link" href="https://pigeonlabz.github.io/gbl-randomiser/" aria-label="Open GBL Randomiser">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none" focusable="false">
                <rect x="5" y="5" width="22" height="22" rx="6" stroke="currentColor" stroke-width="2"/>
                <circle cx="11" cy="11" r="1.7" fill="currentColor"/>
                <circle cx="21" cy="11" r="1.7" fill="currentColor"/>
                <circle cx="16" cy="16" r="1.7" fill="currentColor"/>
                <circle cx="11" cy="21" r="1.7" fill="currentColor"/>
                <circle cx="21" cy="21" r="1.7" fill="currentColor"/>
              </svg>
            </span>
            <span class="tool-copy">
              <h2>GBL Randomiser</h2>
              <p>Random rules, cups &amp; filters for friendly battles.</p>
            </span>
            <span class="tool-arrow" aria-hidden="true">↗</span>
          </a>
        </article>

        <article class="tool-card">
          <a class="tool-link" href="https://pigeonlabz.github.io/showcase-helper/" aria-label="Open Showcase Helper">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none" focusable="false">
                <path d="M10 5h12v5c0 5-2.5 8-6 8s-6-3-6-8V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M10 8H6v2c0 4 2.2 6 6 6M22 8h4v2c0 4-2.2 6-6 6M16 18v5m-5 4h10m-8-4h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 10h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="tool-copy">
              <h2>Showcase Helper</h2>
              <p>Estimate scores and compare Showcase contenders.</p>
            </span>
            <span class="tool-arrow" aria-hidden="true">↗</span>
          </a>
        </article>
      </section>
    </main>
  </body>
</html>
